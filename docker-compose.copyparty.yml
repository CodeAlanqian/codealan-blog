services:
  copyparty:
    image: ghcr.io/9001/copyparty-ac:latest
    container_name: copyparty-file
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:3923"
    volumes:
      - ./copyparty/files:/w
      - ./copyparty/state:/cfg/copyparty
    environment:
      TZ: Asia/Shanghai
    command:
      - --http-only
      - -p
      - "3923"
      - --name
      - CodeAlan Files
      - --site
      - https://file.codealan.top/
      - --rproxy
      - "1"
      - --xff-src
      - lan
      - --xf-proto-fb
      - https
      - --turbo
      - "2"
      - --u2j
      - "6"
      - --u2sz
      - 8,16,64
      - --usernames
      - -a
      - admin:${COPYPARTY_ADMIN_PASSWORD:?set COPYPARTY_ADMIN_PASSWORD in copyparty/.env}
      - -v
      - /w::r:rwmd,admin
